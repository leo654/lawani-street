<script>
/* 3D basketball in the flat icon style: a solid ball with the seams cut out, built like the line-art coffee cup on
   the home page (a small software renderer on a 2D canvas). The seams are real 3D curves: two great circles and one
   smooth curved seam on each side. Its resting pose was fitted to the reference drawing; it spins about the axis
   through the two side seams, so they always stay at the edges. Drag to spin it. */
(function(){
  var cv=document.querySelector('[data-ball-3d]');if(!cv)return;
  var ctx=cv.getContext('2d'),TAU=Math.PI*2;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var curves=[],N=200,i,t,SC=0.6,SK=0.1;
  function add(f){var c=[];for(i=0;i<=N;i++){t=i/N*TAU;c.push(f(Math.cos(t),Math.sin(t)));}curves.push(c);}
  add(function(c,s){return[0,c,s];});
  add(function(c,s){return[c,0,s];});
  // one smooth curved seam on each side (as in the glossy reference)
  [1,-1].forEach(function(sg){add(function(c,s){var x=SC+SK*(2*c*c-1),r=Math.sqrt(Math.max(0,1-x*x));return[sg*x,r*c,r*s];});});
  // pose fitted to the reference drawing: spin (about the ball's x axis), then fixed turns
  var spin=-0.625,B=-2.7915,G=2.40,yaw=0,spinVel=reduce?0:-1.1,IDLE=reduce?0:-1.1;
  var cb=Math.cos(B),sb=Math.sin(B),cg=Math.cos(G),sgn=Math.sin(G);
  function rot(p){
    var x=p[0],y=p[1],z=p[2],ca=Math.cos(spin),sa=Math.sin(spin);
    var y1=y*ca-z*sa,z1=y*sa+z*ca;                 // spin
    var x2=x*cb+z1*sb,z2=-x*sb+z1*cb;              // fixed pose
    var x3=x2*cg-y1*sgn,y3=x2*sgn+y1*cg;
    var cy=Math.cos(yaw),sy=Math.sin(yaw);         // drag sideways turns it
    return[x3*cy+z2*sy,y3,-x3*sy+z2*cy];
  }
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(r.width*d));if(cv.width!==w){cv.width=w;cv.height=w;}}
  var PERIOD=3.2,clock=0;
  function bounce(p){
    if(p<0.26){var u=p/0.26;return{h:4*u*(1-u),sq:0};}
    if(p<0.42){var v=(p-0.26)/0.16;return{h:0.3*4*v*(1-v),sq:Math.max(0,1-Math.abs(p-0.26)/0.025)};}
    return{h:0,sq:Math.max(0,1-Math.abs(p-0.42)/0.025)*0.5};
  }
  function draw(){
    size();var W=cv.width,R=W*0.34,cs=getComputedStyle(document.documentElement);
    var fg=cs.getPropertyValue('--fg').trim()||'red',bg=cs.getPropertyValue('--bg').trim()||'#000';
    var b=reduce?{h:0,sq:0}:bounce((clock%PERIOD)/PERIOD);
    var floor=W*0.92,cx=W/2,cy=floor-R-W*0.03-b.h*W*0.2,sx=1+0.04*b.sq,sy=1-0.05*b.sq;
    ctx.clearRect(0,0,W,W);
    // flat floor shadow, like the map pin's
    ctx.save();ctx.globalAlpha=0.22*(1-0.5*b.h);ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(cx,floor,R*(0.62-0.22*b.h),R*0.09,0,0,TAU);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(cx,cy+R);ctx.scale(sx,sy);ctx.translate(-cx,-(cy+R));
    ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fillStyle=fg;ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R+1,0,TAU);ctx.clip();
    ctx.strokeStyle=bg;ctx.lineCap='round';var base=R*0.075;
    curves.forEach(function(c){
      var prev=null;
      for(var k=0;k<c.length;k++){
        var q=rot(c[k]);
        if(prev&&(q[2]>0||prev[2]>0)){
          var z=Math.max(0,(q[2]+prev[2])/2);
          ctx.lineWidth=base*(0.55+0.45*Math.sqrt(z));
          ctx.beginPath();ctx.moveTo(cx+prev[0]*R,cy-prev[1]*R);ctx.lineTo(cx+q[0]*R,cy-q[1]*R);ctx.stroke();
        }
        prev=q;
      }
    });
    ctx.restore();ctx.restore();
  }
  var dragging=false,lastX=0,lastY=0,lastT=0,last=performance.now();
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
    if(!dragging){spinVel+=(IDLE-spinVel)*Math.min(1,dt*1.2);spin+=spinVel*dt;yaw+=(0-yaw)*Math.min(1,dt*1.8);}
    draw();requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown',function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;lastT=e.timeStamp;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',function(e){if(!dragging)return;var r=cv.getBoundingClientRect().width||1,dx=(e.clientX-lastX)/r*Math.PI,dy=(e.clientY-lastY)/r*Math.PI,dt=Math.max(0.008,(e.timeStamp-lastT)/1000);
    yaw=Math.max(-1.3,Math.min(1.3,yaw+dx));spin+=dy;spinVel=reduce?0:Math.max(-16,Math.min(16,dy/dt));lastX=e.clientX;lastY=e.clientY;lastT=e.timeStamp;if(reduce)draw();});
  function up(){dragging=false;}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.closest('.cell').addEventListener('pointerenter',function(){clock=0;});
  if(reduce){draw();addEventListener('resize',draw);new MutationObserver(draw).observe(document.documentElement,{attributes:true});}else requestAnimationFrame(frame);
})();
</script></body></html>
