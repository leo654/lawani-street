document.getElementById('invert').addEventListener('click',function(){var p=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',p);document.documentElement.toggleAttribute('data-invert',p);window.parent.postMessage({type:'kicksjoint-icons-invert',inverted:p},'*');});
document.querySelectorAll('.cell').forEach(function(c){
  function replay(){c.querySelector('svg').querySelectorAll('*').forEach(function(n){n.getAnimations().forEach(function(a){a.cancel();a.play();});});}
  c.addEventListener('pointerenter',replay);c.addEventListener('click',replay);
});
</script></body></html>
